version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: farmacias_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmacias_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      RUTA_UPLOADS_RESULTADOS: /app/uploads/resultados
    ports:
      - "3000:3000"
    volumes:
      - uploads_resultados:/app/uploads/resultados

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmacias_frontend
    restart: always
    depends_on:
      - backend
    env_file: .env
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  uploads_resultados:
