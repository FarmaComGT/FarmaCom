services:
  db:
    image: postgres:16-alpine
    container_name: farmacias_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
    command: ["npm", "run", "db:migrate"]

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DB_HOST: db
    command:
      - sh
      - -c
      - |
        if [ "$$NODE_ENV" = "development" ]; then
          npm run db:seed:demo
        else
          echo "Seed de demostración omitido para NODE_ENV=$$NODE_ENV."
        fi

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmacias_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DB_HOST: db
      RUTA_UPLOADS_RESULTADOS: /app/uploads/resultados
    ports:
      - "3000:3000"
    volumes:
      - uploads_resultados:/app/uploads/resultados
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmacias_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  uploads_resultados:
