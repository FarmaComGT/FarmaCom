coleccion:
  get:
    tags: [Productos]
    operationId: obtenerProductos
    x-farmacom-roles: [dueno, administrador, dependiente]
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
autocompletar:
  get:
    tags: [Productos]
    operationId: autocompletarProductos
    x-farmacom-roles: [dueno, administrador, dependiente]
    parameters:
      - name: busqueda
        in: query
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
        example: amoxicilina
      - name: limite
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
lectura:
  get:
    tags: [Productos]
    operationId: buscarProductoPorLectura
    x-farmacom-roles: [dueno, administrador, dependiente]
    description: Busca por código literal y devuelve lotes vendibles de la sucursal autenticada.
    parameters:
      - name: codigo
        in: query
        required: true
        schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[!-~]+$' }
        example: TEST-0001
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
      '404': { $ref: '../components/responses.yaml#/NoEncontrado' }
      '409':
        description: Código ambiguo, producto inactivo o sin lotes vendibles.
porId:
  get:
    tags: [Productos]
    operationId: obtenerProductoPorId
    x-farmacom-roles: [dueno, administrador, dependiente]
    parameters:
      - { $ref: '../components/parameters.yaml#/Id' }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
      '404': { $ref: '../components/responses.yaml#/NoEncontrado' }
historialPrecios:
  get:
    tags: [Productos]
    operationId: obtenerHistorialPreciosProducto
    x-farmacom-roles: [dueno, administrador]
    parameters:
      - { $ref: '../components/parameters.yaml#/Id' }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
      '404': { $ref: '../components/responses.yaml#/NoEncontrado' }
promociones:
  get:
    tags: [Productos]
    operationId: obtenerPromocionesProducto
    x-farmacom-roles: [dueno, administrador, dependiente]
    parameters:
      - { $ref: '../components/parameters.yaml#/IdProducto' }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
promocionPorId:
  get:
    tags: [Productos]
    operationId: obtenerPromocionPorId
    x-farmacom-roles: [dueno, administrador, dependiente]
    parameters:
      - { $ref: '../components/parameters.yaml#/Id' }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
      '404': { $ref: '../components/responses.yaml#/NoEncontrado' }
promocionesGenerales:
  get:
    tags: [Productos]
    operationId: obtenerPromocionesGenerales
    x-farmacom-roles: [dueno, administrador, dependiente]
    parameters:
      - { name: busqueda, in: query, schema: { type: string, maxLength: 150 } }
      - { name: estado, in: query, schema: { type: string, enum: [todas, vigente, programada, finalizada, desactivada, agotada] } }
      - { name: id_producto, in: query, schema: { type: integer, minimum: 1 } }
      - { name: id_sucursal, in: query, schema: { type: integer, minimum: 1 } }
      - { name: pagina, in: query, schema: { type: integer, minimum: 1 } }
      - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
seleccionPromocion:
  get:
    tags: [Productos]
    operationId: buscarProductosParaPromocion
    x-farmacom-roles: [dueno, administrador]
    parameters:
      - { name: busqueda, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 }, example: paracetamol }
      - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
lecturaSeleccionPromocion:
  get:
    tags: [Productos]
    operationId: seleccionarProductoPromocionPorCodigo
    x-farmacom-roles: [dueno, administrador]
    parameters:
      - { name: codigo, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 64 }, example: '000123456789' }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
      '404': { $ref: '../components/responses.yaml#/NoEncontrado' }
      '409': { description: Código ambiguo o producto inactivo }
referenciaPromocion:
  get:
    tags: [Productos]
    operationId: obtenerPrecioReferenciaPromocion
    x-farmacom-roles: [dueno, administrador]
    parameters:
      - { $ref: '../components/parameters.yaml#/IdProducto' }
      - { name: id_sucursal, in: query, required: true, schema: { type: integer, minimum: 1 }, example: 1 }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
