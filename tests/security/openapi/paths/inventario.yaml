inventarioSucursal:
  get:
    tags: [Inventario]
    operationId: obtenerInventarioSucursal
    description: >-
      Con pagina devuelve datos y metadatos del conjunto filtrado; sin pagina conserva
      el arreglo completo para los consumidores actuales, incluido el POS. Los demás
      parámetros de listado se aplican únicamente en modo paginado. El resumen global
      se obtiene por separado en /inventario/resumen. Orden por prioridad de alertas,
      nombre_comercial e id_producto. Las páginas mayores al máximo regresan a la última.
    x-farmacom-roles: [dueno, administrador, dependiente]
    x-farmacom-scope: sucursal
    parameters:
      - { $ref: '../components/parameters.yaml#/IdSucursal' }
      - in: query
        name: pagina
        description: Activa la respuesta paginada. Sin resultados la página efectiva es 1.
        schema: { type: integer, minimum: 1, maximum: 2147483647 }
      - in: query
        name: limite
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      - in: query
        name: busqueda
        description: Subcadena literal de código, nombre comercial o genérico, sin distinguir mayúsculas; conserva tildes. Se recortan espacios exteriores.
        schema: { type: string, maxLength: 150 }
      - in: query
        name: id_categoria
        schema: { type: integer, minimum: 1, maximum: 2147483647 }
      - in: query
        name: activo
        schema: { type: boolean }
      - in: query
        name: estado_stock
        schema: { type: string, enum: [normal, agotado, poco_stock, sin_lotes] }
      - in: query
        name: estado_vencimiento
        schema: { type: string, enum: [normal, vencido, proximo_a_vencer, sin_lotes] }
    responses:
      '200':
        description: Inventario por sucursal, completo o paginado según los parámetros.
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items: { type: object }
                - type: object
                  required: [datos, paginacion]
                  properties:
                    datos:
                      type: array
                      items: { type: object }
                    paginacion:
                      type: object
                      required: [pagina, limite, total, total_paginas]
                      properties:
                        pagina: { type: integer, minimum: 1 }
                        limite: { type: integer, minimum: 1, maximum: 100 }
                        total: { type: integer, minimum: 0 }
                        total_paginas: { type: integer, minimum: 1 }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
      '404': { $ref: '../components/responses.yaml#/NoEncontrado' }
resumenInventario:
  get:
    tags: [Inventario]
    operationId: obtenerResumenInventarioSucursal
    x-farmacom-roles: [dueno, administrador, dependiente]
