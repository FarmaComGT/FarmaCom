coleccion:
  get:
    tags: [Caja]
    operationId: obtenerCajas
    x-farmacom-roles: [dueno, administrador, dependiente]
    parameters:
      - { $ref: '../components/parameters.yaml#/FiltroIdSucursal' }
      - name: activa
        in: query
        schema: { type: boolean }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
sesionActual:
  get:
    tags: [Caja]
    operationId: obtenerSesionActualCaja
    x-farmacom-roles: [dueno, administrador, dependiente]
    parameters:
      - { $ref: '../components/parameters.yaml#/Id' }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
      '404': { $ref: '../components/responses.yaml#/NoEncontrado' }
cierres:
  get:
    tags: [Caja]
    operationId: obtenerCierresCaja
    x-farmacom-roles: [dueno, administrador]
    parameters:
      - { $ref: '../components/parameters.yaml#/FiltroIdSucursal' }
      - name: id_caja
        in: query
        schema: { type: integer, minimum: 1 }
      - { $ref: '../components/parameters.yaml#/FechaDesde' }
      - { $ref: '../components/parameters.yaml#/FechaHasta' }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
resumenDiario:
  get:
    tags: [Caja]
    operationId: obtenerResumenDiarioCaja
    x-farmacom-roles: [dueno, administrador]
    parameters:
      - name: fecha
        in: query
        required: true
        schema: { type: string, format: date }
        example: '2026-09-24'
      - { $ref: '../components/parameters.yaml#/FiltroIdSucursal' }
    responses:
      '200': { $ref: '../components/responses.yaml#/RespuestaExitosa' }
      '400': { $ref: '../components/responses.yaml#/SolicitudInvalida' }
      '401': { $ref: '../components/responses.yaml#/NoAutenticado' }
      '403': { $ref: '../components/responses.yaml#/AccesoDenegado' }
