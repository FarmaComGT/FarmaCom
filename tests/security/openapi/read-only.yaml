openapi: 3.0.3
info:
  title: FarmaCom - superficie de lectura para pruebas de seguridad
  version: 1.0.0
  description: >-
    Contrato limitado a operaciones sin efectos de escritura. Los valores de
    ejemplo son ficticios y el plan de ZAP reemplaza la URL del servidor con el
    objetivo local autorizado.
servers:
  - url: http://localhost:3000
security:
  - cookieAuth: []
tags:
